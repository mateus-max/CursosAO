<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APSAN Academy - Login</title>

    <link rel="stylesheet" href="Style/style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                <div class="logo-circle">A</div>
            </div>

            <h1>APSAN Academy</h1>

            <p class="login-subtitle">
                Aceda à sua conta
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Utilizador</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Digite o seu utilizador"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Palavra-passe</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite a sua palavra-passe"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="userType">Tipo de acesso</label>

                    <select id="userType" required>
                        <option value="">Selecione</option>
                        <option value="direcao">Direção</option>
                        <option value="professor">Professor</option>
                        <option value="aluno">Aluno</option>
                    </select>
                </div>

                <button type="submit" class="login-button">
                    Entrar
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>

            <div class="login-footer">
                <span>APSAN Academy</span>
                <small>Plataforma de Ensino Online</small>
            </div>

        </section>

    </main>

    <script src="Apps/main.js"></script>

</body>
</html>
