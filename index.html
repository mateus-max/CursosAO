<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APSAN Academy - Login</title>

    <style>
        :root{
            --blue:#1769e0;
            --blue-dark:#0d47b5;
            --blue-soft:#eaf3ff;
            --text:#172033;
            --muted:#718096;
            --border:#e4eaf2;
            --white:#ffffff;
        }

        *{box-sizing:border-box}

        html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif}

        body.login-page{
            min-height:100vh;
            background:
                radial-gradient(circle at 12% 18%, rgba(58,132,255,.22), transparent 28%),
                radial-gradient(circle at 88% 82%, rgba(23,105,224,.18), transparent 30%),
                linear-gradient(135deg,#f4f8ff 0%,#eef5ff 48%,#e8f1ff 100%);
            color:var(--text);
            overflow-x:hidden;
        }

        body.login-page::before{
            content:"";
            position:fixed;
            width:360px;
            height:360px;
            border-radius:50%;
            background:rgba(255,255,255,.5);
            filter:blur(2px);
            top:-170px;
            right:-100px;
            pointer-events:none;
        }

        .login-container{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:32px 18px;
        }

        .login-card{
            width:min(100%,460px);
            background:rgba(255,255,255,.94);
            border:1px solid rgba(255,255,255,.85);
            border-radius:28px;
            padding:38px 38px 25px;
            box-shadow:0 24px 70px rgba(24,63,120,.16);
            backdrop-filter:blur(14px);
            animation:cardIn .55s ease both;
        }

        @keyframes cardIn{
            from{opacity:0;transform:translateY(18px)}
            to{opacity:1;transform:translateY(0)}
        }

        .login-logo{
            display:flex;
            justify-content:center;
            margin-bottom:18px;
        }

        .logo-circle{
            width:76px;
            height:76px;
            display:grid;
            place-items:center;
            border-radius:23px;
            background:linear-gradient(145deg,var(--blue),var(--blue-dark));
            color:white;
            font-size:32px;
            font-weight:800;
            box-shadow:0 14px 28px rgba(23,105,224,.28);
            position:relative;
        }

        .logo-circle::after{
            content:"";
            position:absolute;
            inset:7px;
            border:1px solid rgba(255,255,255,.25);
            border-radius:18px;
        }

        .login-card h1{
            margin:0;
            text-align:center;
            font-size:28px;
            letter-spacing:-.6px;
            color:#13213a;
        }

        .login-subtitle{
            margin:8px 0 28px;
            text-align:center;
            color:var(--muted);
            font-size:15px;
        }

        #loginForm{display:grid;gap:18px}

        .form-group{display:grid;gap:8px}

        .form-group label{
            font-size:13px;
            font-weight:700;
            color:#334155;
        }

        .form-group input,
        .form-group select{
            width:100%;
            height:52px;
            border:1px solid var(--border);
            border-radius:14px;
            background:#f9fbfe;
            color:#172033;
            padding:0 15px;
            font-size:15px;
            outline:none;
            transition:.2s ease;
        }

        .form-group input::placeholder{color:#9aa7b8}

        .form-group input:focus,
        .form-group select:focus{
            border-color:#5592ed;
            background:white;
            box-shadow:0 0 0 4px rgba(23,105,224,.10);
        }

        .login-button{
            width:100%;
            height:54px;
            border:0;
            border-radius:15px;
            background:linear-gradient(135deg,var(--blue),var(--blue-dark));
            color:white;
            font-size:16px;
            font-weight:800;
            cursor:pointer;
            box-shadow:0 12px 24px rgba(23,105,224,.23);
            transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
        }

        .login-button:hover{
            transform:translateY(-1px);
            filter:brightness(1.03);
            box-shadow:0 15px 28px rgba(23,105,224,.28);
        }

        .login-button:active{transform:translateY(0)}

        .login-message{
            min-height:18px;
            margin:0;
            text-align:center;
            font-size:13px;
        }

        .create-account{
            margin-top:22px;
            padding-top:20px;
            border-top:1px solid #edf1f6;
            text-align:center;
            font-size:14px;
            color:var(--muted);
        }

        .create-account a{
            color:var(--blue);
            font-weight:800;
            text-decoration:none;
            margin-left:5px;
        }

        .create-account a:hover{text-decoration:underline}

        .login-footer{
            margin-top:22px;
            padding-top:17px;
            border-top:1px solid #edf1f6;
            text-align:center;
            display:grid;
            gap:4px;
        }

        .login-footer span{
            color:#52627a;
            font-size:13px;
            font-weight:700;
        }

        .login-footer small{
            color:#9aa7b8;
            font-size:12px;
        }

        @media(max-width:520px){
            .login-container{padding:18px 14px}
            .login-card{padding:30px 22px 22px;border-radius:23px}
            .login-card h1{font-size:25px}
            .logo-circle{width:68px;height:68px;font-size:29px}
        }
    </style>
</head>

<body class="login-page">
    <main class="login-container">
        <section class="login-card">

            <div class="login-logo">
                <div class="logo-circle">A</div>
            </div>

            <h1>APSAN Academy</h1>
            <p class="login-subtitle">Aceda à sua conta para continuar</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Utilizador</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Digite o seu utilizador"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Palavra-passe</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Digite a sua palavra-passe"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="userType">Tipo de acesso</label>
                    <select id="userType" required>
                        <option value="">Selecione o tipo de acesso</option>
                        <option value="direcao">Direção</option>
                        <option value="professor">Professor</option>
                        <option value="aluno">Aluno</option>
                    </select>
                </div>

                <button type="submit" class="login-button">Entrar</button>

                <p id="loginMessage" class="login-message"></p>
            </form>

            <div class="create-account">
                <span>Ainda não tem uma conta?</span>
                <a href="cadastro.html">Criar conta</a>
            </div>

            <div class="login-footer">
                <span>APSAN Academy</span>
                <small>Plataforma de Ensino Online</small>
            </div>

        </section>
    </main>

    <script src="Style/Apps/main.js"></script>
</body>
</html>
