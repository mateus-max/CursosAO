<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APSAN Academy - Mensagens</title>
<link rel="stylesheet" href="../style.css?v=messages-notifications-20260926">
<style>
/* Caixa de entrada estilo SMS: primeiro a lista, depois a conversa. */
.messages-shell{
  display:block;
  min-height:650px;
}
.messages-contacts{
  width:100%;
  border-right:0;
}
.messages-chat{
  display:none;
}
.messages-shell.conversation-open{
  display:grid;
  grid-template-columns:320px 1fr;
}
.messages-shell.conversation-open .messages-chat{
  display:flex;
}
.messages-shell.conversation-open .messages-contacts{
  border-right:1px solid #e5ebf2;
}
.messages-inbox-back{
  display:none;
  border:0;
  background:#eaf3ff;
  color:#1769e0;
  border-radius:9px;
  padding:8px 10px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}
@media(max-width:760px){
  .messages-shell{
    display:block;
    min-height:0;
  }
  .messages-shell.conversation-open{
    display:block;
  }
  .messages-shell.conversation-open .messages-contacts{
    display:none;
  }
  .messages-shell.conversation-open .messages-chat{
    display:flex;
  }
  .messages-inbox-back{
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .messages-chat-header{
    align-items:flex-start;
  }
  .messages-chat-header .messages-delete-conversation{
    font-size:9px;
  }
}

/* =========================================================
   MENSAGENS — VISUAL COMPACTO / CHAT MOBILE
   Mantém a lógica existente; altera apenas a apresentação.
   ========================================================= */
#chatEmpty[hidden],
#chatView[hidden]{
  display:none !important;
}

.messages-page{
  background:#f4f7fb;
}

.messages-content{
  padding:10px 10px 18px;
}

.messages-shell{
  min-height:0;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(20,55,100,.07);
}

/* Caixa inicial: somente lista de conversas, sem área vazia. */
.messages-shell:not(.conversation-open){
  display:block;
}

.messages-shell:not(.conversation-open) .messages-chat{
  display:none;
}

.messages-section-head{
  padding:13px 15px;
}

.messages-section-head h1{
  font-size:18px;
}

.messages-contact-list{
  padding:4px 8px 8px;
}

.messages-contact{
  min-height:62px;
  padding:9px 8px;
  margin:0 0 2px;
  border-radius:11px;
}

.messages-contact-avatar{
  width:42px;
  height:42px;
  flex-basis:42px;
}

.messages-contact-copy strong{
  font-size:13px;
}

.messages-contact-copy small{
  margin-top:2px;
}

.messages-contact-copy em{
  margin-top:3px;
}

/* Chat: ocupa o espaço disponível, como uma conversa de WhatsApp. */
.messages-shell.conversation-open{
  display:block;
  min-height:calc(100vh - 105px);
}

.messages-shell.conversation-open .messages-contacts{
  display:none;
}

.messages-shell.conversation-open .messages-chat{
  display:flex;
  width:100%;
  min-height:calc(100dvh - 105px);
}

.messages-chat-view{
  min-height:calc(100dvh - 105px);
  height:calc(100dvh - 105px);
}

.messages-chat-header{
  position:sticky;
  top:0;
  z-index:3;
  min-height:58px;
  padding:7px 9px;
  gap:7px;
  background:#fff;
}

.messages-chat-person{
  flex:1;
  gap:8px;
  min-width:0;
}

.messages-chat-avatar{
  width:38px;
  height:38px;
  flex-basis:38px;
}

.messages-chat-header h2{
  margin:0;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.messages-chat-header .section-label{
  display:none;
}

.messages-chat-header small{
  display:block;
  margin-top:1px;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.messages-inbox-back{
  display:grid;
  place-items:center;
  width:32px;
  height:38px;
  padding:0;
  flex:0 0 32px;
  border-radius:9px;
  font-size:0;
}

.messages-inbox-back::before{
  content:"←";
  font-size:22px;
  line-height:1;
}

.messages-delete-conversation{
  width:34px;
  height:34px;
  padding:0;
  border:0;
  background:transparent;
  color:#718096;
  font-size:0;
  flex:0 0 34px;
}

.messages-delete-conversation::before{
  content:"⋮";
  font-size:24px;
  line-height:1;
}

.messages-list{
  flex:1;
  min-height:0;
  max-height:none;
  padding:12px 10px 10px;
  background:#f5f8fc;
  overflow:auto;
}

.message-row{
  display:flex;
  align-items:flex-end;
  gap:6px;
  margin:5px 0;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-content{
  min-width:0;
  max-width:82%;
  display:flex;
  flex-direction:column;
}

.message-row.mine .message-content{
  align-items:flex-end;
}

.message-avatar{
  width:30px;
  height:30px;
  flex:0 0 30px;
  display:grid;
  place-items:center;
  border-radius:50%;
  overflow:hidden;
  background:#dfe8f3;
  color:#1769e0;
  font-size:11px;
  font-weight:900;
  margin-bottom:18px;
}

.message-avatar.messages-avatar-photo{
  background:#eef3f8;
}

.message-avatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.message-avatar.mine-avatar{
  order:2;
}

.message-row.mine .message-content{
  order:1;
}

.message-row.theirs .message-avatar{
  order:1;
}

.message-row.theirs .message-content{
  order:2;
}

.messages-chat-avatar.messages-avatar-photo{
  overflow:hidden;
}

.messages-chat-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.messages-contact-avatar.messages-avatar-photo{
  overflow:hidden;
}

.messages-contact-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.message-bubble-wrap{
  margin:4px 0;
}


.message-bubble{
  max-width:82%;
  padding:8px 10px;
  border-radius:12px;
  font-size:13px;
  line-height:1.35;
}

.message-bubble small{
  margin-top:3px;
  font-size:8px;
}

.message-delete{
  font-size:8px;
  margin:2px 5px 0;
}

.messages-chat-notice{
  padding:4px 10px;
  text-align:center;
  font-size:8px;
  color:#8a96a6;
  background:#f5f8fc;
}

.messages-composer{
  position:sticky;
  bottom:0;
  z-index:3;
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:7px 8px;
  border-top:1px solid #e2e8f0;
  background:#fff;
}

.messages-composer textarea{
  flex:1;
  min-height:42px;
  height:42px;
  max-height:110px;
  resize:none;
  border-radius:21px;
  padding:10px 13px;
  font-size:13px;
  line-height:1.25;
}

.messages-composer-footer{
  display:block;
  margin:0;
}

.messages-composer-footer small{
  display:none;
}

.messages-composer-footer .login-button{
  width:42px;
  min-width:42px;
  height:42px;
  padding:0;
  margin:0;
  border-radius:50%;
  font-size:0;
  display:grid;
  place-items:center;
}

.messages-composer-footer .login-button::before{
  content:"➤";
  font-size:18px;
  line-height:1;
}

.messageWarning,
#messageWarning{
  position:absolute;
  left:8px;
  right:8px;
  bottom:58px;
  margin:0;
  padding:6px 9px;
  border-radius:8px;
  background:#fff4f4;
  font-size:9px;
  z-index:4;
}

@media(min-width:761px){
  .messages-shell:not(.conversation-open){
    max-width:720px;
    margin:0 auto;
  }

  .messages-shell.conversation-open{
    display:grid;
    grid-template-columns:270px 1fr;
    min-height:650px;
  }

  .messages-shell.conversation-open .messages-contacts{
    display:block;
    border-right:1px solid #e5ebf2;
  }

  .messages-shell.conversation-open .messages-chat{
    min-height:650px;
  }

  .messages-chat-view{
    min-height:650px;
    height:650px;
  }

  .messages-composer{
    position:relative;
  }
}

<body class="app-page messages-page">
<header class="app-header">
  <div class="header-left">
    <a class="messages-back" id="messagesBack" href="professor.html" aria-label="Voltar">←</a>
    <strong>APSAN Academy</strong>
  </div>
  <strong class="messages-title">Mensagens <span id="globalUnreadBadge" class="messages-unread-badge" hidden>0</span></strong>
</header>

<main class="app-content messages-content">
  <section class="messages-shell">
    <aside class="messages-contacts">
      <div class="messages-section-head">
        <div>
          <span class="hero-kicker">COMUNICAÇÃO</span>
          <h1 id="contactsTitle">Conversas</h1>
          <small id="contactsUnreadLabel" class="messages-unread-label"></small>
        </div>
        <span class="panel-badge" id="contactsCount">0</span>
      </div>
      <div id="contactsList" class="messages-contact-list"></div>
    </aside>

    <section class="messages-chat" aria-label="Conversa">
      <div id="chatEmpty" class="messages-empty">
        <strong>Selecione uma conversa</strong>
        <p>Escolha um contacto para abrir a conversa particular.</p>
      </div>

      <div id="chatView" class="messages-chat-view" hidden>
        <div class="messages-chat-header">
          <button type="button" class="messages-inbox-back" id="chatBackToInbox" aria-label="Voltar às conversas">← Conversas</button>
          <div class="messages-chat-person">
            <span id="chatAvatar" class="messages-chat-avatar">C</span>
            <div>
              <span class="section-label">CONVERSA PARTICULAR</span>
              <h2 id="chatName">Contacto</h2>
              <small id="chatMeta"></small>
            </div>
          </div>
          <button type="button" class="messages-delete-conversation" id="deleteConversationButton">
            Eliminar mensagens
          </button>
        </div>

        <div id="chatMessages" class="messages-list" aria-live="polite"></div>
        <div id="chatNotice" class="messages-chat-notice" hidden>
          Conversa privada. Somente mensagens de texto.
        </div>

        <form id="messageForm" class="messages-composer" autocomplete="off">
          <textarea id="messageInput" rows="3" maxlength="1000"
            placeholder="Escreva apenas uma mensagem de texto." required></textarea>
          <div class="messages-composer-footer">
            <small>Somente texto. Não envie dados bancários, pagamentos, comprovativos ou ficheiros.</small>
            <button type="submit" class="login-button">Enviar</button>
          </div>
          <p id="messageWarning" class="login-message"></p>
        </form>
      </div>
    </section>
  </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  function normalizePhone(value) {
    const digits = String(value || "").replace(/\D/g, "");
    return digits.length > 9 ? digits.slice(-9) : digits;
  }

  function readJson(key, fallback) {
    try {
      const value = JSON.parse(localStorage.getItem(key) || "");
      return value === null ? fallback : value;
    } catch (error) {
      return fallback;
    }
  }

  function writeJson(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  const accounts = Array.isArray(readJson("apsan_accounts", [])) ? readJson("apsan_accounts", []) : [];
  const sessionType = localStorage.getItem("apsan_user_type") || "";
  const sessionPhone = normalizePhone(localStorage.getItem("apsan_phone"));

  let account = accounts.find(function (item) {
    return item && item.type === sessionType && normalizePhone(item.phone) === sessionPhone;
  }) || null;

  if (!account) account = readJson("apsan_account", null);

  if (!account || (account.type !== "professor" && account.type !== "aluno")) {
    window.location.href = "../../index.html";
    return;
  }

  const role = account.type;
  const myPhone = normalizePhone(account.phone);

  /*
   * Perfil visual das mensagens:
   * usa a mesma conta guardada em apsan_accounts, para que a foto
   * escolhida pelo aluno/professor seja a mesma mostrada no chat.
   */
  function getAccountByPhone(phone, preferredType) {
    const normalized = normalizePhone(phone);
    const allAccounts = Array.isArray(accounts) ? accounts : [];
    return allAccounts.find(function (item) {
      return item &&
        (!preferredType || item.type === preferredType) &&
        normalizePhone(item.phone) === normalized;
    }) || allAccounts.find(function (item) {
      return item && normalizePhone(item.phone) === normalized;
    }) || null;
  }

  function getProfilePhoto(phone, type, fallbackPhoto) {
    const profile = getAccountByPhone(phone, type);
    return (profile && (profile.photo || profile.profilePhoto || profile.avatar)) ||
      fallbackPhoto || "";
  }

  function getProfileName(phone, type, fallbackName) {
    const profile = getAccountByPhone(phone, type);
    return (profile && (profile.name || profile.fullName)) || fallbackName || "Contacto";
  }

  function avatarMarkup(name, photo, className) {
    const letter = String(name || "C").trim().charAt(0).toUpperCase() || "C";
    if (photo) {
      return '<span class="' + className + ' messages-avatar-photo"><img src="' +
        esc(photo) + '" alt="Foto de perfil"></span>';
    }
    return '<span class="' + className + '">' + esc(letter) + '</span>';
  }
  const contactsList = document.getElementById("contactsList");
  const contactsCount = document.getElementById("contactsCount");
  const contactsTitle = document.getElementById("contactsTitle");
  const contactsUnreadLabel = document.getElementById("contactsUnreadLabel");
  const chatEmpty = document.getElementById("chatEmpty");
  const chatView = document.getElementById("chatView");
  let chatAvatar = document.getElementById("chatAvatar");
  const chatName = document.getElementById("chatName");
  const chatMeta = document.getElementById("chatMeta");
  const chatMessages = document.getElementById("chatMessages");
  const chatNotice = document.getElementById("chatNotice");
  const messageForm = document.getElementById("messageForm");
  const messageInput = document.getElementById("messageInput");
  const messageWarning = document.getElementById("messageWarning");
  const deleteConversationButton = document.getElementById("deleteConversationButton");
  const globalUnreadBadge = document.getElementById("globalUnreadBadge");
  const back = document.getElementById("messagesBack");
  const chatBackToInbox = document.getElementById("chatBackToInbox");
  const messagesShell = document.querySelector(".messages-shell");

  back.href = role === "professor" ? "professor.html" : "aluno.html";
  contactsTitle.textContent = role === "professor" ? "Meus alunos" : "Meus professores";

  function esc(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getEnrollments() {
    const items = readJson("apsan_enrollments", []);
    return Array.isArray(items) ? items : [];
  }

  function getLegacyStudents() {
    const items = readJson("apsan_teacher_students", []);
    return Array.isArray(items) ? items : [];
  }

  function getContacts() {
    const result = [];
    const seen = {};

    function add(contact) {
      if (!contact) return;
      const phone = normalizePhone(contact.phone || contact.studentPhone || contact.teacherPhone);
      if (!phone || phone === myPhone) return;
      if (seen[phone]) return;
      seen[phone] = true;
      result.push({
        phone: phone,
        name: contact.name || contact.studentName || contact.teacherName || getProfileName(phone, role, "Contacto"),
        course: contact.course || contact.courseName || "",
        photo: contact.photo || contact.studentPhoto || contact.teacherPhoto || contact.profilePhoto ||
          getProfilePhoto(phone, contact.type || (role === "professor" ? "aluno" : "professor"), "")
      });
    }

    getEnrollments().forEach(function (item) {
      if (!item || item.status !== "official") return;
      if (role === "professor" && normalizePhone(item.teacherPhone) === myPhone) {
        add({ phone: item.studentPhone, name: item.studentName, course: item.course, type: "aluno" });
      }
      if (role === "aluno" && normalizePhone(item.studentPhone) === myPhone) {
        add({ phone: item.teacherPhone, name: item.teacherName, course: item.course, type: "professor" });
      }
    });

    if (role === "professor") {
      getLegacyStudents().forEach(function (item) {
        if (item && normalizePhone(item.teacherPhone) === myPhone &&
            (item.status === "confirmed" || item.status === "official")) {
          add({ phone: item.studentPhone, name: item.studentName || item.name, course: item.course, type: "aluno" });
        }
      });
    }

    return result.sort(function (a, b) {
      return a.name.localeCompare(b.name, "pt");
    });
  }

  function readMessages() {
    const items = readJson("apsan_messages", []);
    return Array.isArray(items) ? items : [];
  }

  function saveMessages(items) {
    writeJson("apsan_messages", items);
  }

  function readNotifications() {
    const items = readJson("apsan_message_notifications", []);
    return Array.isArray(items) ? items : [];
  }

  function saveNotifications(items) {
    writeJson("apsan_message_notifications", items);
  }

  function conversationKey(a, b) {
    return [normalizePhone(a), normalizePhone(b)].sort().join("::");
  }

  function hasEmoji(text) {
    return /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}]/u.test(text);
  }

  function hasRestrictedData(text) {
    /*
     * Bloqueio reforçado de dados de contacto e financeiros.
     * A verificação é feita antes de guardar a mensagem, portanto o
     * conteúdo recusado nunca entra em apsan_messages nem gera notificação.
     */
    const value = String(text || "")
      .normalize("NFKC")
      .toLowerCase()
      .replace(/[‐‑‒–—−]/g, "-");

    const terms = [
      /* Identificadores bancários / pagamento */
      "iban", "nib", "ibn", "swift", "bic", "bfa",
      "multicaixa", "multicaixa express", "multicaixa-express",
      "mcx", "mcx express", "mcx-express",
      "conta bancária", "conta bancaria", "número da conta", "numero da conta",
      "nº da conta", "no da conta", "n. da conta", "dados bancários", "dados bancarios",
      "dados de pagamento", "informações bancárias", "informacoes bancarias",
      "informação bancária", "informacao bancaria",
      "transferência bancária", "transferencia bancaria",
      "transferência", "transferencia", "pagamento",
      "comprovativo", "comprovativo de pagamento",
      "referência de pagamento", "referencia de pagamento",
      "referência multicaixa", "referencia multicaixa",
      "código bancário", "codigo bancario", "código de banco", "codigo de banco",
      "cartão bancário", "cartao bancario", "cartão multicaixa", "cartao multicaixa"
    ];

    if (terms.some(function (term) { return value.includes(term); })) {
      return true;
    }

    /*
     * Telefone angolano: 9 dígitos nacionais, inclusive quando escritos
     * com espaços/hífens/pontos ou com o indicativo internacional +244.
     * Ex.: 923456789, 923 456 789, 923-456-789, +244 923 456 789.
     */
    const phonePattern = /(?<!\d)(?:\+?244[\s.-]*)?(?:\d{3}[\s.-]*\d{3}[\s.-]*\d{3})(?!\d)/;
    if (phonePattern.test(value)) {
      return true;
    }

    /*
     * Números longos escritos diretamente ou formatados como blocos:
     * protege contra tentativas simples de contornar o bloqueio de contas
     * e referências numéricas.
     */
    if (/\b\d{10,}\b/.test(value)) {
      return true;
    }

    /* Número de contacto/telefone acompanhado de qualquer formatação. */
    if (/(?:telefone|telemóvel|telemovel|contacto|contato|whatsapp|whats)\s*[:=.-]?\s*(?:\+?\d[\d\s().-]{7,})/i.test(value)) {
      return true;
    }

    return false;
  }

  function unreadForMe() {
    return readNotifications().filter(function (item) {
      return normalizePhone(item.recipientPhone) === myPhone && !item.readAt;
    });
  }

  function unreadForConversation(phone) {
    const key = conversationKey(myPhone, phone);
    return unreadForMe().filter(function (item) {
      return item.conversationKey === key;
    });
  }

  function updateUnreadUI() {
    const unread = unreadForMe();
    const count = unread.length;
    globalUnreadBadge.textContent = count;
    globalUnreadBadge.hidden = count === 0;

    contactsUnreadLabel.textContent = count
      ? count + (count === 1 ? " nova mensagem" : " novas mensagens")
      : "";

    const professorBadge = window.parent && window.parent.document
      ? window.parent.document.getElementById("professorMessageMenuBadge")
      : null;
    if (professorBadge) {
      professorBadge.textContent = count;
      professorBadge.hidden = count === 0;
    }
  }

  function markConversationRead(phone) {
    const key = conversationKey(myPhone, phone);
    const now = new Date().toISOString();
    const notifications = readNotifications().map(function (item) {
      if (
        normalizePhone(item.recipientPhone) === myPhone &&
        item.conversationKey === key &&
        !item.readAt
      ) {
        return Object.assign({}, item, { readAt: now });
      }
      return item;
    });
    saveNotifications(notifications);
    updateUnreadUI();
  }

  function renderContacts() {
    const contacts = getContacts();
    contactsCount.textContent = contacts.length;
    const all = readMessages();

    if (!contacts.length) {
      contactsList.innerHTML =
        '<div class="messages-no-contacts"><strong>Nenhuma conversa disponível.</strong><p>As conversas aparecem quando existir uma matrícula oficial entre os perfis.</p></div>';
      updateUnreadUI();
      return;
    }

    contactsList.innerHTML = contacts.map(function (contact, index) {
      const key = conversationKey(myPhone, contact.phone);
      const conversation = all.filter(function (item) { return item.conversationKey === key; });
      const last = conversation.length ? conversation[conversation.length - 1] : null;
      const unread = unreadForConversation(contact.phone).length;

      return '<button type="button" class="messages-contact' + (unread ? ' has-unread' : '') + '" data-contact-index="' + index + '">' +
        avatarMarkup(contact.name, contact.photo, "messages-contact-avatar") +
        '<span class="messages-contact-copy">' +
          '<strong>' + esc(contact.name) + '</strong>' +
          '<small>' + esc(contact.course || "Conversa particular") + '</small>' +
          (last ? '<em>' + esc(last.text.slice(0, 52)) + '</em>' : '') +
        '</span>' +
        (unread ? '<span class="messages-contact-unread">' + unread + '</span>' : '') +
      '</button>';
    }).join("");

    contactsList.querySelectorAll("[data-contact-phone]").forEach(function (button) {
      button.addEventListener("click", function () {
        openConversation(contacts[Number(button.getAttribute("data-contact-index"))].phone);
      });
    });

    updateUnreadUI();
  }

  let selectedContact = null;

  function showInbox() {
    selectedContact = null;
    messagesShell.classList.remove("conversation-open");
    chatView.hidden = true;
    chatEmpty.hidden = true;
  }

  function openConversation(phone) {
    selectedContact = getContacts().find(function (item) {
      return item.phone === normalizePhone(phone);
    }) || null;
    if (!selectedContact) return;

    markConversationRead(selectedContact.phone);
    messagesShell.classList.add("conversation-open");

    chatEmpty.hidden = true;
    chatView.hidden = false;
    const selectedType = role === "professor" ? "aluno" : "professor";
    const selectedPhoto = getProfilePhoto(selectedContact.phone, selectedType, selectedContact.photo);
    const selectedName = getProfileName(selectedContact.phone, selectedType, selectedContact.name);
    chatAvatar.outerHTML = avatarMarkup(selectedName, selectedPhoto, "messages-chat-avatar");
    chatAvatar = document.querySelector(".messages-chat-avatar");
    chatName.textContent = selectedName;
    chatMeta.textContent = selectedContact.course || "Conversa particular";
    messageWarning.textContent = "";
    chatNotice.hidden = false;
    renderMessages();
    renderContacts();
    messageInput.focus();
    keepComposerAndKeyboardVisible();
  }

  function renderMessages() {
    if (!selectedContact) return;

    const key = conversationKey(myPhone, selectedContact.phone);
    const items = readMessages().filter(function (item) {
      return item.conversationKey === key;
    });

    if (!items.length) {
      chatMessages.innerHTML =
        '<div class="messages-empty messages-empty-inline"><strong>Sem mensagens ainda</strong><p>Inicie a conversa com uma mensagem escrita.</p></div>';
      return;
    }

    chatMessages.innerHTML = items.map(function (item) {
      const mine = normalizePhone(item.senderPhone) === myPhone;
      const senderType = item.senderType || (mine ? role : (role === "professor" ? "aluno" : "professor"));
      const senderPhoto = getProfilePhoto(item.senderPhone, senderType, item.senderPhoto || "");
      const senderName = getProfileName(item.senderPhone, senderType, item.senderName || (mine ? account.name : selectedContact.name));
      const avatarClass = mine ? "message-avatar mine-avatar" : "message-avatar";
      return '<div class="message-row ' + (mine ? "mine" : "theirs") + '">' +
        avatarMarkup(senderName, senderPhoto, avatarClass) +
        '<div class="message-content">' +
          '<div class="message-bubble">' +
            '<span>' + esc(item.text).replace(/\n/g, "<br>") + '</span>' +
            '<small>' + new Date(item.createdAt).toLocaleString("pt-PT", { dateStyle:"short", timeStyle:"short" }) + '</small>' +
          '</div>' +
          '<button type="button" class="message-delete" data-delete-message="' + esc(item.id) + '" aria-label="Eliminar mensagem">Eliminar</button>' +
        '</div>' +
      '</div>';
    }).join("");

    chatMessages.querySelectorAll("[data-delete-message]").forEach(function (button) {
      button.addEventListener("click", function () {
        const id = button.getAttribute("data-delete-message");
        if (!window.confirm("Eliminar esta mensagem?")) return;

        const remaining = readMessages().filter(function (item) {
          return item.id !== id;
        });
        saveMessages(remaining);

        const notifications = readNotifications().filter(function (item) {
          if (item.messageId !== id) return true;
          /* A notificação do outro participante permanece até ele abrir a conversa. */
          return normalizePhone(item.recipientPhone) !== myPhone && !item.readAt;
        });
        saveNotifications(notifications);

        renderMessages();
        renderContacts();
        updateUnreadUI();
      });
    });

    scrollMessagesToBottom("auto");
  }

  deleteConversationButton.addEventListener("click", function () {
    if (!selectedContact) return;
    if (!window.confirm("Eliminar todas as mensagens desta conversa?")) return;

    const key = conversationKey(myPhone, selectedContact.phone);
    saveMessages(readMessages().filter(function (item) {
      return item.conversationKey !== key;
    }));
    saveNotifications(readNotifications().filter(function (item) {
      if (item.conversationKey !== key) return true;
      /* Só removemos a notificação desta conta; a do outro lado só desaparece ao abrir. */
      return normalizePhone(item.recipientPhone) !== myPhone && !item.readAt;
    }));

    renderMessages();
    renderContacts();
    updateUnreadUI();
  });

  function scrollMessagesToBottom(behavior) {
    if (!chatMessages) return;
    requestAnimationFrame(function () {
      chatMessages.scrollTo({
        top: chatMessages.scrollHeight,
        behavior: behavior || "auto"
      });
    });
  }

  function keepComposerAndKeyboardVisible() {
    scrollMessagesToBottom("auto");
    setTimeout(function () { scrollMessagesToBottom("auto"); }, 120);
    setTimeout(function () { scrollMessagesToBottom("auto"); }, 350);
  }

  messageInput.addEventListener("focus", keepComposerAndKeyboardVisible);
  messageInput.addEventListener("input", function () {
    requestAnimationFrame(function () {
      if (messageInput.scrollHeight > messageInput.clientHeight) {
        messageInput.style.height = Math.min(messageInput.scrollHeight, 110) + "px";
      }
      scrollMessagesToBottom("auto");
    });
  });
  messageInput.addEventListener("blur", function () {
    messageInput.style.height = "42px";
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", keepComposerAndKeyboardVisible);
    window.visualViewport.addEventListener("scroll", keepComposerAndKeyboardVisible);
  }

  messageForm.addEventListener("submit", function (event) {
    event.preventDefault();
    if (!selectedContact) return;

    const text = messageInput.value.trim();
    messageWarning.style.color = "#d93025";

    if (!text) {
      messageWarning.textContent = "Escreva uma mensagem.";
      return;
    }
    if (hasEmoji(text)) {
      messageWarning.textContent = "Emojis não são permitidos nesta conversa.";
      return;
    }
    if (hasRestrictedData(text)) {
      messageWarning.textContent = "Não é permitido enviar dados bancários, informações de pagamento ou comprovativos nesta conversa.";
      return;
    }

    const now = new Date().toISOString();
    const messageId = "msg_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    const key = conversationKey(myPhone, selectedContact.phone);
    const items = readMessages();

    items.push({
      id: messageId,
      conversationKey: key,
      senderPhone: myPhone,
      senderType: role,
      senderName: account.name || (role === "professor" ? "Professor" : "Aluno"),
      senderPhoto: account.photo || account.profilePhoto || account.avatar || "",
      receiverPhone: selectedContact.phone,
      receiverType: role === "professor" ? "aluno" : "professor",
      receiverName: selectedContact.name,
      text: text,
      createdAt: now
    });
    saveMessages(items);

    const notifications = readNotifications();
    notifications.push({
      id: "notif_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
      messageId: messageId,
      conversationKey: key,
      recipientPhone: selectedContact.phone,
      recipientType: role === "professor" ? "aluno" : "professor",
      senderPhone: myPhone,
      senderType: role,
      senderName: account.name || (role === "professor" ? "Professor" : "Aluno"),
      textPreview: text.slice(0, 80),
      createdAt: now,
      readAt: null
    });
    saveNotifications(notifications);

    messageInput.value = "";
    messageWarning.textContent = "";
    renderMessages();
    renderContacts();
    updateUnreadUI();
    scrollMessagesToBottom("smooth");
  });

  chatBackToInbox.addEventListener("click", function () {
    showInbox();
    renderContacts();
    updateUnreadUI();
  });

  window.addEventListener("storage", function (event) {
    if (event.key === "apsan_messages" || event.key === "apsan_message_notifications") {
      renderContacts();
      updateUnreadUI();
      if (selectedContact) renderMessages();
    }
  });

  showInbox();
  renderContacts();
  updateUnreadUI();
  setInterval(function () {
    renderContacts();
    if (selectedContact) renderMessages();
  }, 2000);
});
</script>
</body>
</html>
