<style>

.classroom-brand{display:flex;align-items:center;gap:10px;min-width:210px}.classroom-brand-mark{width:38px;height:38px;border-radius:10px;background:#fff;color:#1769e0;display:grid;place-items:center;font-weight:1000;font-size:22px}.classroom-brand strong{font-size:16px}.classroom-title{flex:1;min-width:0}.classroom-title strong{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.classroom-title small{color:#9eb0c8}.live-pill{display:inline-flex;align-items:center;gap:6px;color:#fff;background:#e53935;padding:5px 9px;border-radius:999px;font-weight:900;font-size:11px;margin-left:8px}.live-dot{width:7px;height:7px;border-radius:50%;background:#fff}

.classroom-main{min-width:0;display:flex;flex-direction:column;background:#16263d}.board-toolbar{display:flex;align-items:center;gap:5px;padding:8px;border-bottom:1px solid #d7e0eb;background:#fff;color:#172033;overflow-x:auto}.tool{min-width:48px;height:44px;border:1px solid #dce4ee;background:#fff;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:10px;font-weight:800}.tool span{font-size:17px}.tool.active{background:#eaf3ff;border-color:#1769e0;color:#0d47b5}.tool-danger{color:#c62828}

.classroom-bottom{height:72px;display:flex;align-items:center;justify-content:center;gap:8px;background:#0d1d38;border-top:1px solid rgba(255,255,255,.08)}.class-control{border:0;background:#172d4c;color:#fff;border-radius:12px;min-width:74px;height:54px;cursor:pointer;font-weight:800}.class-control span{display:block;font-size:19px}.class-control.danger{background:#ef4444}
.classroom-right{background:#f7f9fc;color:#172033;display:flex;flex-direction:column;min-width:0}.right-tabs{display:flex;border-bottom:1px solid #dce4ee}.right-tabs button{flex:1;border:0;background:#fff;padding:14px 8px;font-weight:900;cursor:pointer}.right-tabs button.active{color:#1769e0;border-bottom:3px solid #1769e0}.right-panel{display:none;flex:1;min-height:0;overflow:auto;padding:14px}.right-panel.active{display:block}.participant{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #e7edf4}.participant-avatar{width:34px;height:34px;border-radius:50%;background:#dce9fb;display:grid;place-items:center;font-weight:900;color:#1769e0;overflow:hidden}.participant-avatar img{width:100%;height:100%;object-fit:cover}.participant small{display:block;color:#718096}.chat-list{min-height:300px}.chat-msg{padding:8px 0;border-bottom:1px solid #e7edf4}.chat-msg strong{font-size:12px}.chat-msg p{margin:3px 0 0;font-size:13px;line-height:1.35}.chat-input{display:flex;gap:6px;position:sticky;bottom:0;background:#f7f9fc;padding-top:10px}.chat-input input{flex:1;min-width:0;border:1px solid #d7e0eb;border-radius:10px;padding:10px}.chat-input button{border:0;background:#1769e0;color:#fff;border-radius:10px;padding:0 14px;font-weight:900}.class-info-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:12px}.class-info-card strong{display:block;margin-bottom:5px}.class-info-card small{color:#718096}.status-ok{color:#16803c;font-weight:900}.status-warn{color:#b26a00;font-weight:900}

.board-object-document small{font-size:9px;color:#718096}

.board-object-minimized .board-object-media,.board-object-minimized .board-object-document{display:none}
.board-object-minimized{width:58px!important;height:36px!important;min-width:58px;min-height:36px}
.board-object-minimized .board-object-tools{left:3px;right:3px;top:3px}
.board-object-resize{position:absolute;right:-5px;bottom:-5px;width:14px;height:14px;border-radius:4px;background:#1769e0;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:nwse-resize;z-index:5}
.board-object-minimized .board-object-resize{display:none}
.class-timer{display:none;align-items:center;justify-content:center;min-width:72px;padding:6px 9px;border-radius:8px;background:#102542;color:#fff;font:900 12px/1.1 monospace;border:1px solid rgba(255,255,255,.12)}.class-timer.active{display:inline-flex}
.text-format-bar{display:flex;align-items:center;gap:5px;padding:5px 7px;border:1px solid #dce4ee;border-radius:9px;background:#f7f9fc;box-shadow:0 5px 14px rgba(0,0,0,.08);flex:0 0 auto}.text-format-bar[hidden]{display:none}.text-format-bar select{height:30px;border:1px solid #cfd9e5;border-radius:6px;background:#fff;color:#172033;font-size:10px;font-weight:700;padding:0 5px}.text-format-bar input[type=color]{width:30px;height:30px;padding:2px;border:1px solid #cfd9e5;border-radius:6px;background:#fff}.text-format-bar button{width:30px;height:30px;border:1px solid #cfd9e5;border-radius:6px;background:#fff;color:#172033;cursor:pointer}.text-format-bar button.active{background:#eaf3ff;border-color:#1769e0;color:#1769e0}
.board-object-tools{opacity:0;pointer-events:none;transition:opacity .12s ease}.board-object.is-selected .board-object-tools{opacity:1;pointer-events:auto}.board-object-text{width:100%;height:100%;padding:0;outline:0;border:0;background:transparent;color:#172033;font-family:Arial;font-size:20px;line-height:1.35;white-space:pre-wrap;overflow:visible;box-sizing:border-box;cursor:text;caret-color:#1769e0;touch-action:auto;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}.board-object-text:empty:before{content:"";display:none}.board-object-text p{margin:0 0 .55em}.board-object-text:focus{cursor:text}.board-object-text *{max-width:100%}.board-object-text div{margin:0}.board-object-text br{line-height:1.35}
@media(max-width:900px){.classroom-body{grid-template-columns:64px minmax(0,1fr)}.classroom-side{padding:10px 6px}.classroom-side button{justify-content:center;font-size:0}.classroom-side button span{font-size:20px}.classroom-right{position:fixed;right:0;top:66px;bottom:72px;width:min(88vw,330px);z-index:30;transform:translateX(100%);transition:.2s;box-shadow:-12px 0 30px rgba(0,0,0,.2)}.classroom-right.open{transform:translateX(0)}}

<body class="classroom-page">
<div class="classroom-shell">
<header class="classroom-top">
    <div class="classroom-brand"><div class="classroom-brand-mark">A</div><strong>APSAN Academy</strong></div>
    <div class="classroom-title">
        <strong id="classTitle">Sala Virtual</strong>
        <small id="classMeta">Quadro interativo de aprendizagem</small>
    </div>
    <div id="liveStatus"></div><div id="classTimer" class="class-timer" aria-live="polite">00:00:00</div>
    <div class="classroom-top-actions">
        <button type="button" id="startClass" class="start-class-button">▶ Começar aula</button>
        <button type="button" id="openRecordings" class="recordings-button">▣ Gravações</button>
        <button type="button" id="shareScreen">▣ Partilhar ecrã</button>
        <button type="button" id="toggleRight">☰ Participantes</button>
        <button type="button" class="leave" id="leaveClass">Sair</button>
    </div>
</header>

<div class="classroom-body">
<aside class="classroom-side">
    <button class="active" data-tab="board"><span>🖥</span> Quadro</button>
    <button data-tab="content"><span>📚</span> Conteúdo</button>
    <button data-tab="tasks"><span>✓</span> Tarefas</button>
    <button data-tab="poll"><span>📊</span> Votação</button>
    <button data-tab="timer"><span>⏱</span> Temporizador</button>
</aside>

<main class="classroom-main">
    <div class="board-toolbar">
        <button class="tool active" data-tool="pen"><span>🖊</span>Caneta</button>
        <button class="tool" data-tool="highlighter"><span>🖍</span>Destacar</button>
        <button class="tool" data-tool="eraser"><span>⌫</span>Borracha</button>
        <button class="tool" data-tool="line"><span>╱</span>Seta/Linha</button>
        <button class="tool" data-tool="rect"><span>□</span>Forma</button>
        <button class="tool" data-tool="circle"><span>○</span>Círculo</button>
        <button class="tool" data-tool="text"><span>T</span>Texto</button>
        <button class="tool" id="addImage"><span>▧</span>Imagem</button>
        <button class="tool" id="addDocument"><span>▤</span>Documento</button>
        <button class="tool" id="undoBoard"><span>↶</span>Desfazer</button>
        <button class="tool tool-danger" id="clearBoard"><span>⌫</span>Limpar</button>
        <div id="textFormatBar" class="text-format-bar" hidden>
          <select id="textFontFamily" title="Tipo de letra"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option><option value="Times New Roman">Times New Roman</option><option value="Courier New">Courier New</option></select>
          <select id="textFontSize" title="Tamanho"><option value="16px">16</option><option value="20px" selected>20</option><option value="24px">24</option><option value="28px">28</option><option value="34px">34</option><option value="42px">42</option></select>
          <input id="textColor" type="color" value="#172033" title="Cor do texto">
          <button type="button" id="textBold" title="Negrito"><b>B</b></button>
          <button type="button" id="textItalic" title="Itálico"><i>I</i></button>
          <button type="button" id="textUnderline" title="Sublinhado"><u>U</u></button>
          <button type="button" id="textStrike" title="Riscado"><s>S</s></button>
          <input id="textBackground" type="color" value="#fff2a8" title="Fundo/destaque do texto">
          <button type="button" id="textAlignLeft" title="Alinhar à esquerda">≡</button>
          <button type="button" id="textAlignCenter" title="Centralizar">≡</button>
          <button type="button" id="textAlignRight" title="Alinhar à direita">≡</button>
        </div>
        <input id="boardImageInput" type="file" accept="image/*" hidden>
        <input id="boardDocumentInput" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.csv" hidden>
    </div>

    <div class="board-wrap">
        <div class="board">
            <canvas id="whiteboardCanvas"></canvas>
            <div id="boardObjects" class="board-objects"></div>
            <div id="boardEmpty" class="board-empty">Quadro livre para preparar, testar e editar antes ou durante a aula.</div>
            <div id="boardTextEditor" class="board-text-editor" contenteditable="true" spellcheck="true" hidden></div>
            <div id="cameraDock" class="camera-dock" hidden>
                <div class="camera-dock-head"><strong id="cameraDockName">Professor</strong><button type="button" id="closeCameraDock" aria-label="Fechar pré-visualização">×</button></div>
                <video id="localCamera" autoplay playsinline muted></video>
                <span class="camera-status">Câmara do professor</span>
            </div>
        </div>
    </div>

    <div class="classroom-bottom">
        <button class="class-control" id="toggleMic"><span>🎙</span>Microfone</button>
        <button class="class-control" id="toggleCamera"><span>▣</span>Câmara</button>
        <button class="class-control" id="recordClass"><span>⏺</span>Gravar aula</button>
        <button class="class-control" id="raiseHand"><span>✋</span>Levantar mão</button>
        <button class="class-control" id="openChat"><span>💬</span>Chat</button>
        <button class="class-control" id="openParticipants"><span>👥</span>Participantes</button>
        <button class="class-control" id="endClass"><span>⏹</span>Terminar aula</button>
    </div>
</main>

<aside class="classroom-right" id="rightPanel">
    <div class="right-tabs">
        <button class="active" data-right-tab="participants">Participantes</button>
        <button data-right-tab="chat">Chat</button>
    </div>
    <section class="right-panel active" id="participantsPanel">
        <div class="class-info-card"><strong id="participantSummary">Participantes</strong><small>Alunos oficiais desta aula.</small></div>
        <div id="participantVideoGrid" class="participant-video-grid"></div>
        <div id="participantList"></div>
    </section>
    <section class="right-panel" id="chatPanel">
        <div id="chatList" class="chat-list"></div>
        <div class="chat-input"><input id="chatInput" maxlength="300" placeholder="Escreva uma mensagem..."><button id="sendChat">Enviar</button></div>
    </section>
</aside>
</div>
</div>
<div id="toast" class="classroom-toast"></div>
<div id="recordingIndicator" class="recording-indicator"><i></i> GRAVANDO AULA</div>
<div id="recordingsOverlay" class="recordings-overlay">
  <div class="recordings-card">

<script>
(function(){
"use strict";
const params=new URLSearchParams(location.search);
const liveId=params.get("live")||"";
const account=(()=>{try{return JSON.parse(localStorage.getItem("apsan_account")||"{}")}catch(_){return {}}})();
const role=account.type||localStorage.getItem("apsan_user_type")||"";
const phone=String(account.phone||localStorage.getItem("apsan_phone")||"").replace(/\D/g,"");
const canvas=document.getElementById("whiteboardCanvas"),ctx=canvas.getContext("2d");
const boardEmpty=document.getElementById("boardEmpty");
let live=null, drawing=false, startX=0,startY=0,tool="pen",undoStack=[],stream=null,micStream=null,recording=false,mediaRecorder=null,recordedChunks=[],recordingCanvas=null,recordingCtx=null,recordingTimer=null,startedAt=Date.now(),textEditorOpen=false,lastBoardPoint={x:24,y:24},cameraPosition={x:null,y:null};
let boardObjectStoreKey=()=> "apsan_board_objects_"+(liveId||("draft_"+phone));

function read(k,f){try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?f:v}catch(_){return f}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600)}
function getLive(){return read("apsan_live_classes",[]).find(x=>x&&x.id===liveId)||null}
function resizeCanvas(){const rect=canvas.getBoundingClientRect();const old=canvas.toDataURL();canvas.width=Math.max(1,Math.floor(rect.width*devicePixelRatio));canvas.height=Math.max(1,Math.floor(rect.height*devicePixelRatio));ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(old&&old!=="data:,"){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,rect.width,rect.height);im.src=old}}
function boardKey(){return liveId?"apsan_live_board_"+liveId:"apsan_live_board_draft_"+phone}
function saveBoard(){try{write(boardKey(),canvas.toDataURL("image/png"));boardEmpty.classList.add("hidden");if(liveId&&typeof BroadcastChannel!=="undefined"){try{new BroadcastChannel("apsan-live-"+liveId).postMessage({type:"board",at:Date.now()})}catch(_){}}}catch(_){}}
function setPreClassState(){const start=document.getElementById("startClass");const active=!!(live&&live.active);const teacher=role==="professor";if(teacher){start.hidden=false;start.textContent=active?"● Aula em curso":"▶ Começar aula";start.disabled=active}else{start.hidden=true}document.getElementById("openRecordings").hidden=false;document.getElementById("boardEmpty").classList.toggle("hidden",!!read(boardKey(),null));document.getElementById("classTimer").classList.toggle("active",active);}
function classStudents(){return Array.isArray(live&&live.students)?live.students:[]}
function makeLiveId(){return "live_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function clearPreClassWork(){try{ctx.clearRect(0,0,canvas.width,canvas.height);undoStack=[];boardEmpty.classList.remove("hidden");localStorage.removeItem("apsan_live_board_"+liveId);localStorage.removeItem("apsan_board_documents_"+liveId);localStorage.removeItem("apsan_board_objects_"+liveId);localStorage.removeItem("apsan_live_board_draft_"+phone);localStorage.removeItem("apsan_board_documents_draft_"+phone);localStorage.removeItem("apsan_board_objects_draft_"+phone);renderBoardDocuments();renderBoardObjects()}catch(_){}} 
function startClass(){if(role!=="professor")return;if(live&&live.active)return;const all=read("apsan_live_classes",[]);const id=liveId||makeLiveId();const draftBoard=localStorage.getItem("apsan_live_board_draft_"+phone);const draftDocs=localStorage.getItem("apsan_board_documents_draft_"+phone);const draftObjects=localStorage.getItem("apsan_board_objects_draft_"+phone);const item=live||{id,title:new URLSearchParams(location.search).get("title")||"Aula ao vivo",course:new URLSearchParams(location.search).get("course")||"Curso",teacherName:account.name||"Professor",teacherPhone:phone,students:[]};item.id=id;item.active=true;item.startedAt=new Date().toISOString();item.teacherName=account.name||item.teacherName||"Professor";item.teacherPhone=phone;item.students=Array.isArray(item.students)?item.students:[];const idx=all.findIndex(x=>x&&x.id===id);if(idx>=0)all[idx]=item;else all.push(item);write("apsan_live_classes",all);if(!liveId){if(draftBoard)localStorage.setItem("apsan_live_board_"+id,draftBoard);if(draftDocs)localStorage.setItem("apsan_board_documents_"+id,draftDocs);if(draftObjects)localStorage.setItem("apsan_board_objects_"+id,draftObjects);history.replaceState({}, "", "quadro.html?live="+encodeURIComponent(id));location.reload();return}live=item;renderLive();loadBoard();renderBoardObjects();renderBoardDocuments();toast("A aula começou. O cronómetro foi iniciado.")}
function loadBoard(){const data=localStorage.getItem(boardKey());if(!data)return;const im=new Image();im.onload=()=>{const r=canvas.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height);boardEmpty.classList.add("hidden")};im.src=data}
function formatDuration(ms){const total=Math.max(0,Math.floor(ms/1000));const h=String(Math.floor(total/3600)).padStart(2,"0"),m=String(Math.floor((total%3600)/60)).padStart(2,"0"),s=String(total%60).padStart(2,"0");return h+":"+m+":"+s}
function updateClassTimer(){const el=document.getElementById("classTimer");if(!el)return;if(live&&live.active&&live.startedAt){el.textContent=formatDuration(Date.now()-new Date(live.startedAt).getTime());el.classList.add("active")}else{el.textContent="00:00:00";el.classList.remove("active")}}
function snapshot(){undoStack.push(canvas.toDataURL("image/png"));if(undoStack.length>15)undoStack.shift()}
function pointer(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function nextObjectZ(){return boardObjects().reduce((m,o)=>Math.max(m,Number(o.z)||20),20)+1}
function openTextEditor(p){if(role!=="professor")return;const items=boardObjects();const item={id:"text_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),kind:"text",html:"",x:Math.max(6,p.x),y:Math.max(6,p.y),w:360,h:40,z:nextObjectZ(),fontFamily:"Arial",fontSize:"20px",color:"#172033"};items.push(item);saveBoardObjects(items);renderBoardObjects();requestAnimationFrame(()=>{const el=document.querySelector('.board-object[data-id="'+item.id+'"] .board-object-text');if(el){selectBoardObject(item.id);el.focus({preventScroll:true});const range=document.createRange();range.selectNodeContents(el);range.collapse(false);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);setTimeout(()=>{if(document.activeElement!==el){el.focus({preventScroll:true})}},80)}})}
function commitActiveTextObject(){const el=document.querySelector(".board-object-text:focus");if(!el)return;const id=el.closest(".board-object")?.dataset.id;if(!id)return;const items=boardObjects(),o=items.find(x=>x.id===id);if(o){o.html=el.innerHTML;saveBoardObjects(items)}}
function down(e){if(role!=="professor")return;const p=pointer(e);lastBoardPoint=p;if(tool==="text"){openTextEditor(p);return}drawing=true;startX=p.x;startY=p.y;snapshot();ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=tool==="highlighter"?"rgba(255,220,0,.42)":tool==="eraser"?"#fff":"#1769e0";ctx.lineWidth=tool==="highlighter"?18:tool==="eraser"?24:3}
function move(e){if(!drawing)return;const p=pointer(e);if(tool==="pen"||tool==="highlighter"||tool==="eraser"){ctx.lineTo(p.x,p.y);ctx.stroke()}else{loadUndoPreview(p)}}
function up(e){if(!drawing)return;drawing=false;const p=pointer(e);if(tool==="line"){ctx.strokeStyle="#1769e0";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(p.x,p.y);ctx.stroke()}else if(tool==="rect"){ctx.strokeStyle="#1769e0";ctx.lineWidth=3;ctx.strokeRect(startX,startY,p.x-startX,p.y-startY)}else if(tool==="circle"){ctx.strokeStyle="#1769e0";ctx.lineWidth=3;const rx=(p.x-startX)/2,ry=(p.y-startY)/2;ctx.beginPath();ctx.ellipse(startX+rx,startY+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx.stroke()}saveBoard()}
function loadUndoPreview(){return}
canvas.addEventListener("pointerdown",down);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",up);canvas.addEventListener("pointerleave",up);canvas.addEventListener("pointercancel",up);
window.addEventListener("resize",()=>{resizeCanvas();loadBoard();renderBoardObjects()});

document.getElementById("textAlignCenter").onclick=e=>{e.preventDefault();formatSelectedText("justifyCenter")};
document.getElementById("textAlignRight").onclick=e=>{e.preventDefault();formatSelectedText("justifyRight")};
document.addEventListener("selectionchange",()=>{const active=document.activeElement;if(active&&active.classList?.contains("board-object-text"))saveTextSelection()});
document.getElementById("boardObjects").addEventListener("click",e=>{const obj=e.target.closest(".board-object");if(obj)selectBoardObject(obj.dataset.id)});

document.querySelectorAll("[data-tool]").forEach(b=>b.addEventListener("click",()=>{tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("active",x===b))}));
document.getElementById("undoBoard").onclick=()=>{const data=undoStack.pop();if(!data)return;const im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);const r=canvas.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height);saveBoard()};im.src=data};
document.getElementById("clearBoard").onclick=()=>{if(role!=="professor"&&!role.includes("direcao"))return;ctx.clearRect(0,0,canvas.width,canvas.height);boardEmpty.classList.remove("hidden");saveBoard()};
document.getElementById("addImage").onclick=()=>document.getElementById("boardImageInput").click();
function boardObjects(){return read(boardObjectStoreKey(),[])}
function saveBoardObjects(items){write(boardObjectStoreKey(),items)}
function objectBringToFront(id){const items=boardObjects();const max=items.reduce((m,o)=>Math.max(m,Number(o.z)||20),20);const o=items.find(x=>x.id===id);if(o){o.z=max+1;saveBoardObjects(items);renderBoardObjects()}}
function objectSendToBack(id){const items=boardObjects();const min=items.reduce((m,o)=>Math.min(m,Number(o.z)||20),20);const o=items.find(x=>x.id===id);if(o){o.z=Math.max(10,min-1);saveBoardObjects(items);renderBoardObjects()}}
function updateBoardObject(id,patch){const items=boardObjects();const o=items.find(x=>x.id===id);if(!o)return;Object.assign(o,patch);saveBoardObjects(items)}
function deleteBoardObject(id){const items=boardObjects().filter(x=>x.id!==id);saveBoardObjects(items);renderBoardObjects();toast("Objeto removido do quadro.")}
function toggleBoardObjectMin(id){const items=boardObjects();const o=items.find(x=>x.id===id);if(o){o.minimized=!o.minimized;saveBoardObjects(items);renderBoardObjects()}}
let selectedBoardObjectId=null;
let savedTextSelection=null;
function saveTextSelection(){const sel=window.getSelection();if(!sel||!sel.rangeCount)return;const editor=sel.anchorNode?.parentElement?.closest?.(".board-object-text");if(!editor)return;const range=sel.getRangeAt(0);savedTextSelection={editor,range:range.cloneRange()}}
function restoreTextSelection(editor){if(!editor)return;editor.focus({preventScroll:true});if(savedTextSelection&&savedTextSelection.editor===editor){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedTextSelection.range)}}
function selectBoardObject(id){selectedBoardObjectId=id;const obj=boardObjects().find(o=>o.id===id);if(obj&&obj.kind==="text"){document.querySelectorAll(".board-object.is-selected").forEach(x=>x.classList.remove("is-selected"));const el=document.querySelector('.board-object[data-id="'+id+'"]');if(el)el.classList.add("is-selected");showTextFormatBarForSelection();return}renderBoardObjects();showTextFormatBarForSelection()}
function deselectBoardObjects(){selectedBoardObjectId=null;document.querySelectorAll(".board-object.is-selected").forEach(x=>x.classList.remove("is-selected"));hideTextFormatBar()}
function renderBoardObjects(){const host=document.getElementById("boardObjects");if(!host)return;const focusedId=document.activeElement?.closest?.(".board-object")?.dataset.id||null;host.innerHTML="";boardObjects().forEach(o=>{const el=document.createElement("div");el.className="board-object"+(o.minimized?" board-object-minimized":"")+(selectedBoardObjectId===o.id?" is-selected":"");el.dataset.id=o.id;el.style.left=(Number(o.x)||8)+"px";el.style.top=(Number(o.y)||8)+"px";el.style.width=(Number(o.w)||180)+"px";el.style.height=(Number(o.h)||120)+"px";el.style.zIndex=String(Number(o.z)||20);
const tools=document.createElement("div");tools.className="board-object-tools";tools.innerHTML='<button type="button" title="Minimizar">'+(o.minimized?"▢":"−")+'</button><button type="button" title="Trazer para frente">↑</button><button type="button" title="Enviar para trás">↓</button><button type="button" class="delete" title="Apagar">×</button>';el.appendChild(tools);tools.children[0].onclick=e=>{e.stopPropagation();toggleBoardObjectMin(o.id)};tools.children[1].onclick=e=>{e.stopPropagation();objectBringToFront(o.id)};tools.children[2].onclick=e=>{e.stopPropagation();objectSendToBack(o.id)};tools.children[3].onclick=e=>{e.stopPropagation();if(confirm("Apagar este objeto do quadro?"))deleteBoardObject(o.id)};
if(o.kind==="image"){const media=document.createElement("div");media.className="board-object-media";const img=document.createElement("img");img.src=o.src;img.alt=o.name||"Imagem";img.draggable=false;media.appendChild(img);el.appendChild(media)}
else if(o.kind==="text"){el.classList.add("board-text-object");el.style.width=(Number(o.w)||360)+"px";el.style.height="auto";const editor=document.createElement("div");editor.className="board-object-text";editor.contentEditable="true";editor.spellcheck=true;editor.innerHTML=o.html||"";editor.style.fontFamily=o.fontFamily||"Arial";editor.style.fontSize=o.fontSize||"20px";editor.style.color=o.color||"#172033";editor.addEventListener("focus",()=>{selectedBoardObjectId=o.id;showTextFormatBarForSelection()});editor.addEventListener("pointerdown",e=>{e.stopPropagation();selectedBoardObjectId=o.id;requestAnimationFrame(()=>{if(document.activeElement!==editor)editor.focus();showTextFormatBarForSelection()})});editor.addEventListener("touchstart",e=>{e.stopPropagation();selectedBoardObjectId=o.id;setTimeout(()=>{if(document.activeElement!==editor)editor.focus();showTextFormatBarForSelection()},0)});editor.addEventListener("input",()=>{const items=boardObjects(),obj=items.find(x=>x.id===o.id);if(obj){obj.html=editor.innerHTML;obj.h=Math.max(40,editor.scrollHeight);saveBoardObjects(items)}});editor.addEventListener("mouseup",()=>{saveTextSelection();showTextFormatBarForSelection()});editor.addEventListener("keyup",()=>{saveTextSelection();showTextFormatBarForSelection()});editor.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();editor.blur();deselectBoardObjects()}});editor.addEventListener("blur",()=>{const items=boardObjects(),obj=items.find(x=>x.id===o.id);if(obj){obj.html=editor.innerHTML;obj.h=Math.max(40,editor.scrollHeight);saveBoardObjects(items)}hideTextFormatBar()});el.appendChild(editor)}
else{const box=document.createElement("div");box.className="board-object-document";box.innerHTML='<strong></strong><small></small><button type="button">Abrir documento</button>';box.querySelector("strong").textContent=o.name||"Documento";box.querySelector("small").textContent=Math.max(1,Math.round((o.size||0)/1024))+" KB";box.querySelector("button").onclick=async e=>{e.stopPropagation();const item=await getBoardDocument(o.id);if(!item)return;const url=URL.createObjectURL(item.file);window.open(url,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(url),60000)};el.appendChild(box)}
const handle=document.createElement("div");handle.className="board-object-resize";el.appendChild(handle);
let action=null,ox=0,oy=0,startW=0,startH=0,startX0=0,startY0=0;
el.addEventListener("pointerdown",e=>{if(e.target.closest("button")||e.target===handle||e.target.closest(".board-object-text")){if(e.target.closest(".board-object-text")){selectedBoardObjectId=o.id;showTextFormatBarForSelection()}return}selectBoardObject(o.id);action="drag";const r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;el.setPointerCapture?.(e.pointerId);el.classList.add("is-selected")});
el.addEventListener("pointermove",e=>{if(!action)return;const br=host.getBoundingClientRect();if(action==="drag"){const x=Math.max(4,Math.min(br.width-el.offsetWidth-4,e.clientX-br.left-ox));const y=Math.max(4,Math.min(br.height-el.offsetHeight-4,e.clientY-br.top-oy));el.style.left=x+"px";el.style.top=y+"px"}else{const w=Math.max(72,Math.min(br.width-(Number(o.x)||0)-4,e.clientX-startX0+startW));const h=Math.max(52,Math.min(br.height-(Number(o.y)||0)-4,e.clientY-startY0+startH));el.style.width=w+"px";el.style.height=h+"px"}});
el.addEventListener("pointerup",e=>{if(!action)return;const x=parseFloat(el.style.left)||8,y=parseFloat(el.style.top)||8,w=parseFloat(el.style.width)||180,h=parseFloat(el.style.height)||120;updateBoardObject(o.id,{x,y,w,h});action=null;el.classList.remove("is-selected")});el.addEventListener("pointercancel",()=>{action=null;el.classList.remove("is-selected")});
handle.addEventListener("pointerdown",e=>{e.stopPropagation();selectBoardObject(o.id);action="resize";const r=el.getBoundingClientRect();startW=r.width;startH=r.height;startX0=e.clientX;startY0=e.clientY;el.setPointerCapture?.(e.pointerId);el.classList.add("is-selected")});
host.appendChild(el)});
}
function showTextFormatBarForSelection(){const bar=document.getElementById("textFormatBar");const obj=boardObjects().find(o=>o.id===selectedBoardObjectId&&o.kind==="text");if(!bar||!obj){hideTextFormatBar();return}bar.hidden=false;const editor=document.querySelector('.board-object[data-id="'+obj.id+'"] .board-object-text');if(editor){document.getElementById("textFontFamily").value=obj.fontFamily||"Arial";document.getElementById("textFontSize").value=obj.fontSize||"20px";document.getElementById("textColor").value=obj.color||"#172033"}}
function hideTextFormatBar(){const bar=document.getElementById("textFormatBar");if(bar)bar.hidden=true}
function formatSelectedText(command,value){const editor=document.querySelector('.board-object[data-id="'+selectedBoardObjectId+'"] .board-object-text');if(!editor)return;restoreTextSelection(editor);try{if(command==="fontName")document.execCommand("fontName",false,value);else if(command==="fontSizePx"){document.execCommand("fontSize",false,"7");editor.querySelectorAll('font[size="7"]').forEach(n=>{n.removeAttribute("size");n.style.fontSize=value})}else if(command==="foreColor")document.execCommand("foreColor",false,value);else if(command==="hiliteColor"){document.execCommand("hiliteColor",false,value);document.execCommand("backColor",false,value)}else document.execCommand(command,false,null)}catch(_){}const items=boardObjects(),o=items.find(x=>x.id===selectedBoardObjectId);if(o){if(command==="fontName")o.fontFamily=value;if(command==="fontSizePx")o.fontSize=value;if(command==="foreColor")o.color=value;o.html=editor.innerHTML;o.h=Math.max(40,editor.scrollHeight);saveBoardObjects(items)}savedTextSelection={editor,range:window.getSelection()?.rangeCount?window.getSelection().getRangeAt(0).cloneRange():null};showTextFormatBarForSelection()}
document.getElementById("boardImageInput").onchange=e=>{const file=e.target.files[0];if(!file||role!=="professor")return;const rd=new FileReader();rd.onload=ev=>{const r=document.querySelector(".board").getBoundingClientRect(),p=lastBoardPoint||{x:24,y:24},maxW=Math.max(100,r.width-p.x-10),maxH=Math.max(80,r.height-p.y-10);const im=new Image();im.onload=()=>{const scale=Math.min(0.7,maxW/im.width,maxH/im.height,1);const item={id:"obj_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),kind:"image",name:file.name,src:ev.target.result,x:Math.max(4,p.x),y:Math.max(4,p.y),w:Math.max(90,Math.round(im.width*scale)),h:Math.max(70,Math.round(im.height*scale)),z:30,minimized:false};const items=boardObjects();item.z=items.reduce((m,o)=>Math.max(m,Number(o.z)||20),29)+1;items.push(item);saveBoardObjects(items);renderBoardObjects();selectBoardObject(item.id);toast("Imagem inserida. Pode arrastar, redimensionar, minimizar ou mudar a camada.")};im.src=ev.target.result};rd.readAsDataURL(file);e.target.value=""};
const documentMetaKey=()=> "apsan_board_documents_"+(liveId||("draft_"+phone));
function openDocsDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error("indexeddb"));const req=indexedDB.open("apsanAcademyBoard",1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("documents"))req.result.createObjectStore("documents",{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveBoardDocument(file,p){try{const db=await openDocsDB(),id="doc_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);await new Promise((res,rej)=>{const tx=db.transaction("documents","readwrite");tx.objectStore("documents").put({id,file,liveId:liveId||("draft_"+phone),name:file.name,type:file.type||"application/octet-stream",size:file.size,createdAt:new Date().toISOString()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();const docs=read(documentMetaKey(),[]);docs.push({id,name:file.name,type:file.type||"application/octet-stream",size:file.size,x:Math.max(8,p.x),y:Math.max(8,p.y)});write(documentMetaKey(),docs);const items=boardObjects();items.push({id,kind:"document",name:file.name,type:file.type||"application/octet-stream",size:file.size,x:Math.max(8,p.x),y:Math.max(8,p.y),w:210,h:105,z:items.reduce((m,o)=>Math.max(m,Number(o.z)||20),29)+1,minimized:false});saveBoardObjects(items);renderBoardDocuments();renderBoardObjects();selectBoardObject(id);toast("Documento inserido. Pode arrastar, redimensionar, minimizar ou mudar a camada.");}catch(_){toast("Não foi possível guardar o documento neste navegador.")}}
async function getBoardDocument(id){try{const db=await openDocsDB();const item=await new Promise((res,rej)=>{const q=db.transaction("documents","readonly").objectStore("documents").get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});db.close();return item||null}catch(_){return null}}
function renderBoardDocuments(){const board=document.querySelector(".board");board.querySelectorAll(".board-document-card").forEach(x=>x.remove());read(documentMetaKey(),[]).forEach(d=>{const el=document.createElement("div");el.className="board-document-card";el.style.left=d.x+"px";el.style.top=d.y+"px";el.innerHTML="<strong>"+String(d.name).replace(/[<>]/g,"")+"</strong><small>"+Math.max(1,Math.round((d.size||0)/1024))+" KB</small><button type=\"button\">Abrir documento</button>";el.querySelector("button").onclick=async ev=>{ev.stopPropagation();const item=await getBoardDocument(d.id);if(!item)return;const url=URL.createObjectURL(item.file);window.open(url,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(url),60000)};board.appendChild(el)})}
document.getElementById("addDocument").onclick=()=>{if(role==="professor")document.getElementById("boardDocumentInput").click()};
document.getElementById("boardDocumentInput").onchange=e=>{const file=e.target.files[0];if(file&&role==="professor")saveBoardDocument(file,lastBoardPoint||{x:24,y:24});e.target.value=""};
function renderLive(){live=getLive();if(!live){if(role==="professor"){live={id:liveId||"",title:"Aula pronta",course:"",teacherName:account.name||"Professor",teacherPhone:phone,students:[],active:false};document.getElementById("classTitle").textContent=live.title;document.getElementById("classMeta").textContent="Quadro preparado · a aula ainda não começou";setPreClassState();return}document.getElementById("classTitle").textContent="Sala Virtual";document.getElementById("classMeta").textContent="Aula não encontrada ou encerrada.";setPreClassState();return}
if(role==="aluno"&&!live.students.includes(phone)){document.getElementById("classTitle").textContent="Acesso não autorizado";document.getElementById("classMeta").textContent="Esta aula está disponível apenas para os alunos oficiais.";return}
document.getElementById("classTitle").textContent=live.title;
document.getElementById("classMeta").textContent=(live.course||"Curso")+" · Prof. "+(live.teacherName||"Professor");
document.getElementById("liveStatus").innerHTML=live.active?'<span class="live-pill"><i class="live-dot"></i> AO VIVO</span>':'<span class="status-warn">Aula encerrada</span>';
const end=document.getElementById("endClass");end.style.display=role==="professor"?"inline-block":"none";
const list=document.getElementById("participantList");const students=live.students||[];const accounts=read("apsan_accounts",[]);
list.innerHTML=students.map(p=>{const a=accounts.find(x=>x&&String(x.phone||"").replace(/\D/g,"")===p)||{};return '<div class="participant"><div class="participant-avatar">'+(a.photo?'<img src="'+a.photo+'">':(String(a.name||"A").charAt(0)))+'</div><div><strong>'+String(a.name||"Aluno")+'</strong><small>Aluno oficial</small></div></div>'}).join("");
document.getElementById("participantSummary").textContent="Participantes ("+students.length+")";
renderParticipantVideos(students,accounts);
setPreClassState();updateClassTimer();
}
function renderParticipantVideos(students,accounts){const grid=document.getElementById("participantVideoGrid");if(!grid)return;grid.innerHTML="";if(live&&live.active&&role==="professor"){const self=document.createElement("div");self.className="participant-video-tile";self.innerHTML="<span>"+String(account.name||"Professor")+" · sua câmara</span>";if(stream&&stream.getVideoTracks().length){const v=document.createElement("video");v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=stream;self.prepend(v)}else{self.insertAdjacentHTML("afterbegin",'<div style="font-size:22px">🎥</div>')}grid.appendChild(self)}students.slice(0,8).forEach(p=>{const a=accounts.find(x=>x&&String(x.phone||"").replace(/\D/g,"")===p)||{};const tile=document.createElement("div");tile.className="participant-video-tile";tile.innerHTML='<div style="font-size:22px">👤</div><span>'+String(a.name||"Aluno")+' · aguardando câmara</span>';grid.appendChild(tile)})}

function chatKey(){return "apsan_live_chat_"+liveId}
function renderChat(){const box=document.getElementById("chatList"),msgs=read(chatKey(),[]);box.innerHTML=msgs.map(m=>'<div class="chat-msg"><strong>'+String(m.name||"Utilizador")+'</strong><p>'+String(m.text||"")+'</p></div>').join("")||'<div class="empty-state">O chat da aula aparecerá aqui.</div>';box.scrollTop=box.scrollHeight}
document.getElementById("sendChat").onclick=()=>{const input=document.getElementById("chatInput"),text=input.value.trim();if(!text)return;const msgs=read(chatKey(),[]);msgs.push({name:account.name||"Utilizador",text,at:new Date().toISOString()});write(chatKey(),msgs.slice(-100));input.value="";renderChat()};
document.getElementById("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("sendChat").click()});
document.querySelectorAll("[data-right-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-right-tab]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".right-panel").forEach(x=>x.classList.toggle("active",x.id===b.dataset.rightTab+"Panel"))});
function toggleRightSection(tab){const panel=document.getElementById("rightPanel"),button=document.querySelector('[data-right-tab="'+tab+'"]');const isOpen=panel.classList.contains("open");const current=button&&button.classList.contains("active");if(isOpen&&current){panel.classList.remove("open");return}panel.classList.add("open");if(button)button.click()}
document.getElementById("toggleRight").onclick=()=>document.getElementById("rightPanel").classList.toggle("open");
document.getElementById("openChat").onclick=()=>toggleRightSection("chat");
document.getElementById("openParticipants").onclick=()=>toggleRightSection("participants");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>toast("Módulo "+b.textContent.trim()+" preparado para a aula."));
document.getElementById("toggleMic").onclick=async()=>{try{if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;document.getElementById("toggleMic").innerHTML="<span>🎙</span>Microfone";return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("media");micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});document.getElementById("toggleMic").innerHTML="<span>🎙</span>Desligar microfone";toast("Microfone ativo neste dispositivo.");}catch(_){toast("Não foi possível ativar o microfone.")}};
function setCameraPosition(x,y){const board=document.querySelector(".board"),dock=document.getElementById("cameraDock");if(!board||!dock)return;const br=board.getBoundingClientRect();const maxX=Math.max(4,br.width-dock.offsetWidth-4),maxY=Math.max(4,br.height-dock.offsetHeight-4);const nx=Math.min(maxX,Math.max(4,x)),ny=Math.min(maxY,Math.max(4,y));dock.style.left=nx+"px";dock.style.top=ny+"px";dock.style.right="auto";cameraPosition={x:nx,y:ny};}
(function enableCameraDrag(){const dock=document.getElementById("cameraDock"),head=dock.querySelector(".camera-dock-head");let dragging=false,ox=0,oy=0;head.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;const r=dock.getBoundingClientRect();dragging=true;ox=e.clientX-r.left;oy=e.clientY-r.top;head.setPointerCapture?.(e.pointerId);dock.classList.add("dragging")});head.addEventListener("pointermove",e=>{if(!dragging)return;const br=document.querySelector(".board").getBoundingClientRect();setCameraPosition(e.clientX-br.left-ox,e.clientY-br.top-oy)});head.addEventListener("pointerup",()=>{dragging=false;dock.classList.remove("dragging")});head.addEventListener("pointercancel",()=>{dragging=false;dock.classList.remove("dragging")})})();
document.getElementById("toggleCamera").onclick=async()=>{try{if(stream&&stream.getVideoTracks().length){stream.getVideoTracks().forEach(t=>t.stop());stream=null;document.getElementById("localCamera").srcObject=null;document.getElementById("cameraDock").hidden=true;document.getElementById("toggleCamera").innerHTML="<span>▣</span>Câmara";renderParticipantVideos(classStudents(),read("apsan_accounts",[]));return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("media");stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}}});const video=document.getElementById("localCamera");video.srcObject=stream;document.getElementById("cameraDock").hidden=false;document.getElementById("cameraDockName").textContent=account.name||"Professor";if(cameraPosition.x==null)setCameraPosition(18,18);document.getElementById("toggleCamera").innerHTML="<span>▣</span>Desligar câmara";renderParticipantVideos(classStudents(),read("apsan_accounts",[]));toast("Câmara ativa.");}catch(_){toast("Não foi possível ativar a câmara. Verifique a permissão do navegador.")}};
document.getElementById("shareScreen").onclick=async()=>{try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});s.getVideoTracks()[0].onended=()=>toast("Partilha de ecrã terminada.");toast("Partilha de ecrã iniciada neste dispositivo.");}catch(_){toast("Partilha de ecrã cancelada.")}};
function openRecordingsDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error("indexeddb"));const req=indexedDB.open("apsanAcademyRecordings",1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("recordings"))req.result.createObjectStore("recordings",{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveRecordingBlob(blob){try{const db=await openRecordingsDB(),id="rec_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);const item={id,liveId:liveId||"draft",name:"Aula_"+new Date().toISOString().replace(/[:.]/g,"-")+".webm",blob,createdAt:new Date().toISOString(),size:blob.size};await new Promise((res,rej)=>{const tx=db.transaction("recordings","readwrite");tx.objectStore("recordings").put(item);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();toast("Gravação guardada automaticamente neste dispositivo.");renderRecordings();}catch(_){toast("A gravação terminou, mas o navegador não conseguiu guardá-la.")}}
async function listRecordings(){try{const db=await openRecordingsDB();const all=await new Promise((res,rej)=>{const q=db.transaction("recordings","readonly").objectStore("recordings").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)});db.close();return all.filter(x=>x.liveId===(liveId||"draft")).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))}catch(_){return []}}
async function renderRecordings(){const box=document.getElementById("recordingsList"),items=await listRecordings();if(!items.length){box.innerHTML='<div class="empty-state">Nenhuma gravação guardada neste dispositivo.</div>';return}box.innerHTML="";items.forEach(item=>{const row=document.createElement("div");row.className="recording-item";row.innerHTML='<div class="recording-item-main"><strong>'+item.name+'</strong><small>'+new Date(item.createdAt).toLocaleString()+" · "+Math.max(1,Math.round(item.size/1024/1024*10)/10)+" MB</small></div><div class=\"recording-item-actions\"><button class=\"open\" type=\"button\">Abrir / guardar</button><button class=\"delete\" type=\"button\">Eliminar</button></div>";row.querySelector(".open").onclick=()=>{const url=URL.createObjectURL(item.blob);const a=document.createElement("a");a.href=url;a.download=item.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};row.querySelector(".delete").onclick=async()=>{const db=await openRecordingsDB();await new Promise((res,rej)=>{const tx=db.transaction("recordings","readwrite");tx.objectStore("recordings").delete(item.id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();renderRecordings()};box.appendChild(row)})}
document.getElementById("openRecordings").onclick=()=>{document.getElementById("recordingsOverlay").classList.add("show");renderRecordings()};
document.getElementById("closeRecordings").onclick=()=>document.getElementById("recordingsOverlay").classList.remove("show");
document.getElementById("recordingsOverlay").addEventListener("click",e=>{if(e.target.id==="recordingsOverlay")e.currentTarget.classList.remove("show")});
function stopRecording(){if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();recording=false;document.getElementById("recordClass").innerHTML="<span>⏺</span>Gravar aula";document.getElementById("recordingIndicator").classList.remove("show");if(recordingTimer){clearInterval(recordingTimer);recordingTimer=null}}
function buildRecordingStream(){const r=canvas.getBoundingClientRect();recordingCanvas=document.createElement("canvas");recordingCanvas.width=Math.max(640,Math.floor(r.width));recordingCanvas.height=Math.max(360,Math.floor(r.height));recordingCtx=recordingCanvas.getContext("2d");const draw=()=>{if(!recording)return;recordingCtx.fillStyle="#fff";recordingCtx.fillRect(0,0,recordingCanvas.width,recordingCanvas.height);recordingCtx.drawImage(canvas,0,0,recordingCanvas.width,recordingCanvas.height);if(stream&&stream.getVideoTracks().length&&document.getElementById("localCamera").readyState>=2){const v=document.getElementById("localCamera"),dock=document.getElementById("cameraDock"),br=document.querySelector(".board").getBoundingClientRect(),dr=dock.getBoundingClientRect();const scaleX=recordingCanvas.width/br.width,scaleY=recordingCanvas.height/br.height;const x=(dr.left-br.left)*scaleX,y=(dr.top-br.top)*scaleY,w=dr.width*scaleX,h=dr.height*scaleY;recordingCtx.fillStyle="#0d1d38";recordingCtx.fillRect(x,y,w,h);recordingCtx.drawImage(v,x+6*scaleX,y+28*scaleY,w-12*scaleX,h-42*scaleY)}};const timer=setInterval(draw,66);return {stream:recordingCanvas.captureStream(15),timer}}
document.getElementById("recordClass").onclick=async()=>{if(!recording){if(!live||!live.active){toast("Comece a aula antes de gravar.");return}try{if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error("recording");if(!micStream&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){try{micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});document.getElementById("toggleMic").innerHTML="<span>🎙</span>Desligar microfone";}catch(_){}}recordedChunks=[];const built=buildRecordingStream();recordingTimer=built.timer;const tracks=[...built.stream.getVideoTracks()];if(micStream)micStream.getAudioTracks().forEach(t=>tracks.push(t));const combined=new MediaStream(tracks);const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")?"video/webm;codecs=vp9":(MediaRecorder.isTypeSupported("video/webm")?"video/webm":"");mediaRecorder=mime?new MediaRecorder(combined,{mimeType:mime}):new MediaRecorder(combined);mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};mediaRecorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"video/webm"});saveRecordingBlob(blob);combined.getTracks().forEach(t=>t.stop());recordedChunks=[];};mediaRecorder.start(1000);recording=true;document.getElementById("recordClass").innerHTML="<span>⏹</span>Parar gravação";document.getElementById("recordingIndicator").classList.add("show");toast("Gravação iniciada.");}catch(_){toast("Não foi possível iniciar a gravação neste navegador.")}}else{stopRecording();toast("A gravação está a ser finalizada e será guardada automaticamente.")}};
document.getElementById("raiseHand").onclick=()=>toast("Mão levantada. O professor verá este estado nesta sessão.");
document.getElementById("startClass").onclick=startClass;
document.getElementById("closeCameraDock").onclick=()=>{const video=document.getElementById("localCamera");if(stream){stream.getVideoTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;document.getElementById("cameraDock").hidden=true;document.getElementById("toggleCamera").innerHTML="<span>▣</span>Câmara";renderParticipantVideos(classStudents(),read("apsan_accounts",[]))};
document.getElementById("endClass").onclick=()=>{if(role!=="professor"||!live)return;if(confirm("Terminar esta aula ao vivo?")){const all=read("apsan_live_classes",[]);const item=all.find(x=>x.id===liveId);if(recording)stopRecording();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}if(item){item.active=false;item.endedAt=new Date().toISOString();write("apsan_live_classes",all)}renderLive();updateClassTimer();toast("Aula terminada.");}};
document.getElementById("leaveClass").onclick=()=>{if(role==="professor"&&live&&live.active&&!confirm("Sair sem terminar a aula?"))return;location.href=role==="professor"?"professor.html":"aluno.html#classroom"};
window.addEventListener("storage",e=>{if(e.key==="apsan_live_classes"){renderLive()}if(e.key===boardKey()){loadBoard()}if(e.key===boardObjectStoreKey()||e.key===documentMetaKey()){renderBoardDocuments()}if(e.key===chatKey()){renderChat()}});
resizeCanvas();renderLive();loadBoard();renderBoardDocuments();renderBoardObjects();renderChat();setPreClassState();updateClassTimer();
setInterval(()=>{renderLive();loadBoard();renderChat();updateClassTimer()},1000);
})();
</script>
