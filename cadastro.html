<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>APSAN Academy - Criar Conta</title>

    <link
        rel="stylesheet"
        href="Style/style.css"
    >

</head>


<body class="login-page">


    <main class="login-container">

        <section class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <div class="logo-circle">
                    A
                </div>

            </div>


            <!-- TÍTULO -->

            <h1>
                Criar Conta
            </h1>


            <p class="login-subtitle">
                Registe-se na APSAN Academy
            </p>


            <!-- FORMULÁRIO -->

            <form id="registerForm">


                <!-- NOME -->

                <div class="form-group">

                    <label for="fullName">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Digite o seu nome completo"
                        required
                    >

                </div>


                <!-- UTILIZADOR -->

                <div class="form-group">

                    <label for="newUsername">
                        Nome de utilizador
                    </label>

                    <input
                        type="text"
                        id="newUsername"
                        placeholder="Escolha um nome de utilizador"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="form-group">

                    <label for="newPassword">
                        Palavra-passe
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Crie uma palavra-passe"
                        required
                    >

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar palavra-passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repita a palavra-passe"
                        required
                    >

                </div>


                <!-- TIPO DE CONTA -->

                <div class="form-group">

                    <label for="newUserType">
                        Tipo de conta
                    </label>

                    <select
                        id="newUserType"
                        required
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="professor">
                            Professor
                        </option>

                        <option value="aluno">
                            Aluno
                        </option>

                    </select>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Criar Conta
                </button>


                <!-- MENSAGEM -->

                <p
                    id="registerMessage"
                    class="login-message"
                ></p>


            </form>


            <!-- VOLTAR -->

            <div
                style="
                    text-align:center;
                    margin-top:20px;
                "
            >

                <a
                    href="index.html"
                    style="
                        color:#0066cc;
                        font-weight:700;
                        text-decoration:none;
                    "
                >
                    ← Voltar para o Login
                </a>

            </div>


            <!-- RODAPÉ -->

            <div class="login-footer">

                <span>
                    APSAN Academy
                </span>

                <small>
                    Plataforma de Ensino Online
                </small>

            </div>


        </section>

    </main>


    <script>

        const registerForm =
            document.getElementById("registerForm");


        registerForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                /* ==========================================
                   RECOLHER DADOS
                   ========================================== */

                const fullName =
                    document
                    .getElementById("fullName")
                    .value
                    .trim();


                const username =
                    document
                    .getElementById("newUsername")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("newPassword")
                    .value
                    .trim();


                const confirmPassword =
                    document
                    .getElementById("confirmPassword")
                    .value
                    .trim();


                const userType =
                    document
                    .getElementById("newUserType")
                    .value;


                const message =
                    document
                    .getElementById("registerMessage");


                /* ==========================================
                   VALIDAÇÕES
                   ========================================== */

                if (
                    !fullName ||
                    !username ||
                    !password ||
                    !confirmPassword ||
                    !userType
                ) {

                    message.style.color = "#d93025";

                    message.textContent =
                        "Preencha todos os campos.";

                    return;
                }


                if (password !== confirmPassword) {

                    message.style.color = "#d93025";

                    message.textContent =
                        "As palavras-passe não coincidem.";

                    return;
                }


                if (password.length < 6) {

                    message.style.color = "#d93025";

                    message.textContent =
                        "A palavra-passe deve ter pelo menos 6 caracteres.";

                    return;
                }


                /* ==========================================
                   VERIFICAR SE JÁ EXISTE CONTA
                   ========================================== */

                const existingAccount =
                    localStorage.getItem("apsan_account");


                if (existingAccount) {

                    const oldAccount =
                        JSON.parse(existingAccount);


                    if (
                        oldAccount.username &&
                        oldAccount.username.toLowerCase() ===
                        username.toLowerCase()
                    ) {

                        message.style.color = "#d93025";

                        message.textContent =
                            "Este nome de utilizador já existe.";

                        return;
                    }

                }


                /* ==========================================
                   CRIAR CONTA
                   ========================================== */

                const account = {

                    name: fullName,

                    username: username,

                    password: password,

                    type: userType,

                    bio: "",

                    photo: "",

                    createdAt:
                        new Date().toISOString()

                };


                /*
                 * Guardar a conta.
                 *
                 * Bio e foto começam vazios.
                 * Posteriormente poderão ser alterados
                 * na área de perfil aberta através do avatar.
                 */

                localStorage.setItem(
                    "apsan_account",
                    JSON.stringify(account)
                );


                /* ==========================================
                   GUARDAR SESSÃO
                   ========================================== */

                localStorage.setItem(
                    "apsan_username",
                    username
                );


                localStorage.setItem(
                    "apsan_user_type",
                    userType
                );


                localStorage.setItem(
                    "apsan_logged_in",
                    "true"
                );


                /* ==========================================
                   MENSAGEM DE SUCESSO
                   ========================================== */

                message.style.color = "#16803c";

                message.textContent =
                    "Conta criada com sucesso! A abrir o seu painel...";


                /* ==========================================
                   ABRIR PAINEL CORRESPONDENTE
                   ========================================== */

                setTimeout(function() {


                    if (userType === "professor") {

                        window.location.href =
                            "professor.html";

                        return;
                    }


                    if (userType === "aluno") {

                        window.location.href =
                            "aluno.html";

                        return;
                    }


                    /*
                     * Segurança adicional:
                     * caso apareça algum tipo inválido,
                     * volta ao login.
                     */

                    window.location.href =
                        "index.html";


                }, 900);

            }
        );

    </script>


</body>
</html>
