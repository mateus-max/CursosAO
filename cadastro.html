<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>APSAN Academy - Criar Conta</title>

    <link
        rel="stylesheet"
        href="Style/style.css"
    >

</head>


<body class="login-page">


    <main class="login-container">

        <section class="login-card">


            <div class="login-logo">

                <div class="logo-circle">
                    A
                </div>

            </div>


            <h1>
                Criar Conta
            </h1>


            <p class="login-subtitle">
                Registe-se na APSAN Academy
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label for="fullName">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Digite o seu nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="newUsername">
                        Nome de utilizador
                    </label>

                    <input
                        type="text"
                        id="newUsername"
                        placeholder="Escolha um utilizador"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        Palavra-passe
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Crie uma palavra-passe"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="newUserType">
                        Tipo de conta
                    </label>

                    <select
                        id="newUserType"
                        required
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="professor">
                            Professor
                        </option>

                        <option value="aluno">
                            Aluno
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Criar Conta
                </button>


                <p
                    id="registerMessage"
                    class="login-message"
                ></p>


            </form>


            <div
                style="
                    text-align:center;
                    margin-top:20px;
                "
            >

                <a
                    href="index.html"
                    style="
                        color:#0066cc;
                        font-weight:700;
                        text-decoration:none;
                    "
                >
                    ← Voltar para o Login
                </a>

            </div>


            <div class="login-footer">

                <span>
                    APSAN Academy
                </span>

                <small>
                    Plataforma de Ensino Online
                </small>

            </div>


        </section>

    </main>


    <script>

        const registerForm =
            document.getElementById("registerForm");


        registerForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const fullName =
                    document.getElementById(
                        "fullName"
                    ).value.trim();


                const username =
                    document.getElementById(
                        "newUsername"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "newPassword"
                    ).value.trim();


                const userType =
                    document.getElementById(
                        "newUserType"
                    ).value;


                const message =
                    document.getElementById(
                        "registerMessage"
                    );


                if (
                    !fullName ||
                    !username ||
                    !password ||
                    !userType
                ) {

                    message.textContent =
                        "Preencha todos os campos.";

                    return;

                }


                /*
                 * Guardar conta localmente
                 * para esta versão inicial.
                 */

                const account = {

                    name: fullName,

                    username: username,

                    password: password,

                    type: userType

                };


                localStorage.setItem(
                    "apsan_account",
                    JSON.stringify(account)
                );


                message.style.color =
                    "#16803c";

                message.textContent =
                    "Conta criada com sucesso!";


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 1000);

            }
        );

    </script>


</body>
</html>
