<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>APSAN Academy - Criar Conta</title>

    <link
        rel="stylesheet"
        href="Style/style.css"
    >

</head>


<body class="login-page">


    <main class="login-container">

        <section class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <div class="logo-circle">
                    A
                </div>

            </div>


            <!-- TÍTULO -->

            <h1>
                Criar Conta
            </h1>


            <p class="login-subtitle">
                Registe-se na APSAN Academy
            </p>


            <!-- FORMULÁRIO -->

            <form id="registerForm">


                <!-- NOME -->

                <div class="form-group">

                    <label for="fullName">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Digite o seu nome completo"
                        required
                    >

                </div>


                <!-- TELEFONE -->

                <div class="form-group">

                    <label for="phone">
                        Número de telefone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Digite o seu número de telefone"
                        inputmode="tel"
                        required
                    >

                </div>


                <!-- UTILIZADOR -->

                <div class="form-group">

                    <label for="newUsername">
                        Nome de utilizador
                    </label>

                    <input
                        type="text"
                        id="newUsername"
                        placeholder="Escolha um nome de utilizador"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="form-group">

                    <label for="newPassword">
                        Palavra-passe
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Crie uma palavra-passe"
                        required
                    >

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar palavra-passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repita a palavra-passe"
                        required
                    >

                </div>


                <!-- TIPO DE CONTA -->

                <div class="form-group">

                    <label for="newUserType">
                        Tipo de conta
                    </label>

                    <select
                        id="newUserType"
                        required
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="professor">
                            Professor
                        </option>

                        <option value="aluno">
                            Aluno
                        </option>

                    </select>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Criar Conta
                </button>


                <!-- MENSAGEM -->

                <p
                    id="registerMessage"
                    class="login-message"
                ></p>


            </form>


            <!-- VOLTAR -->

            <div
                style="
                    text-align:center;
                    margin-top:20px;
                "
            >

                <a
                    href="index.html"
                    style="
                        color:#0066cc;
                        font-weight:700;
                        text-decoration:none;
                    "
                >
                    ← Voltar para o Login
                </a>

            </div>


            <!-- RODAPÉ -->

            <div class="login-footer">

                <span>
                    APSAN Academy
                </span>

                <small>
                    Plataforma de Ensino Online
                </small>

            </div>


        </section>

    </main>


    <script>

        const registerForm =
            document.getElementById("registerForm");


        registerForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                /* ==========================================
                   RECOLHER DADOS
                   ========================================== */

                const fullName =
                    document
                    .getElementById("fullName")
                    .value
                    .trim();


                const username =
                    document
                    .getElementById("newUsername")
                    .value
                    .trim();

                const phone =
                    document
                    .getElementById("phone")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("newPassword")
                    .value
                    .trim();


                const confirmPassword =
                    document
                    .getElementById("confirmPassword")
                    .value
                    .trim();


                const userType =
                    document
                    .getElementById("newUserType")
                    .value;


                const message =
                    document
                    .getElementById("registerMessage");


                /* ==========================================
                   VALIDAÇÕES
                   ========================================== */

                if (
                    !fullName ||
                    !username ||
                    !phone ||
                    !password ||
                    !confirmPassword ||
                    !userType
                ) {

                    message.style.color = "#d93025";

                    message.textContent =
                        "Preencha todos os campos.";

                    return;
                }


                if (password !== confirmPassword) {

                    message.style.color = "#d93025";

                    message.textContent =
                        "As palavras-passe não coincidem.";

                    return;
                }


                if (password.length < 6) {

                    message.style.color = "#d93025";

                    message.textContent =
                        "A palavra-passe deve ter pelo menos 6 caracteres.";

                    return;
                }


                /* ==========================================
                   VERIFICAR SE JÁ EXISTE CONTA
                   ========================================== */

                function normalizePhone(value) {
                    const digits = String(value || "").replace(/\D/g, "");
                    return digits.length > 9 ? digits.slice(-9) : digits;
                }

                let accounts = [];
                try {
                    const stored = JSON.parse(localStorage.getItem("apsan_accounts") || "[]");
                    accounts = Array.isArray(stored) ? stored : [];
                } catch (error) {
                    accounts = [];
                }

                /* Migra a conta antiga sem substituir nenhuma conta existente. */
                try {
                    const legacy = JSON.parse(localStorage.getItem("apsan_account") || "null");
                    if (legacy && legacy.phone) {
                        const legacyExists = accounts.some(function (item) {
                            return normalizePhone(item && item.phone) === normalizePhone(legacy.phone) &&
                                item.type === legacy.type;
                        });
                        if (!legacyExists) {
                            accounts.push(Object.assign({}, legacy, {
                                id: legacy.id || ("acc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8))
                            }));
                        }
                    }
                } catch (error) {
                    /* continua com o catálogo disponível */
                }

                const usernameExists = accounts.some(function (item) {
                    return item && item.username &&
                        item.username.toLowerCase() === username.toLowerCase();
                });

                if (usernameExists) {
                    message.style.color = "#d93025";
                    message.textContent = "Este nome de utilizador já existe.";
                    return;
                }

                const phoneExists = accounts.some(function (item) {
                    return item && normalizePhone(item.phone) === normalizePhone(phone);
                });

                if (phoneExists) {
                    message.style.color = "#d93025";
                    message.textContent = "Este número de telefone já está associado a uma conta.";
                    return;
                }

                /* ==========================================
                   CRIAR CONTA
                   ========================================== */

                const account = {
                    id: "acc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
                    name: fullName,
                    username: username,
                    phone: phone,
                    password: password,
                    type: userType,
                    bio: "",
                    photo: "",
                    createdAt: new Date().toISOString()
                };


                /*
                 * Guardar a conta.
                 *
                 * Bio e foto começam vazios.
                 * Posteriormente poderão ser alterados
                 * na área de perfil aberta através do avatar.
                 */

                localStorage.setItem(
                    "apsan_account",
                    JSON.stringify(account)
                );


                /* ==========================================
                   REGISTAR CONTA NO CATÁLOGO DA PLATAFORMA
                   ========================================== */

                /*
                 * O catálogo é cumulativo: uma nova conta é adicionada,
                 * nunca substitui nem apaga uma conta já criada.
                 */
                accounts.push(account);
                localStorage.setItem(
                    "apsan_accounts",
                    JSON.stringify(accounts)
                );

                /* ==========================================
                   GUARDAR SESSÃO
                   ========================================== */

                localStorage.setItem(
                    "apsan_username",
                    username
                );

                localStorage.setItem(
                    "apsan_phone",
                    phone
                );


                localStorage.setItem(
                    "apsan_user_type",
                    userType
                );


                localStorage.setItem(
                    "apsan_logged_in",
                    "true"
                );


                /* ==========================================
                   MENSAGEM DE SUCESSO
                   ========================================== */

                message.style.color = "#16803c";

                message.textContent =
                    "Conta criada com sucesso! A abrir o seu painel...";


                /* ==========================================
                   ABRIR PAINEL CORRESPONDENTE
                   ========================================== */

                setTimeout(function() {


                    if (userType === "professor") {

                        window.location.href = "Style/Apps/professor.html";

                        return;
                    }


                    if (userType === "aluno") {

                        window.location.href = "Style/Apps/aluno.html";

                        return;
                    }


                    /*
                     * Segurança adicional:
                     * caso apareça algum tipo inválido,
                     * volta ao login.
                     */

                    window.location.href =
                        "index.html";


                }, 900);

            }
        );

    </script>


</body>
</html>
